\* Smaller than PartyInvites.cfg so the statechart tool draws every state (budget 500):
\* one profile per account, so the friend is from the other account and joins by the link.
CONSTANTS
  Accounts = {a1, a2}
  PerAccount = 1
  TorBox = {a1}
  Guests = {g1}
  Rooms = {r1}
  NoOne = NoOne
  Bug = "none"

SPECIFICATION Spec
VIEW ChartView

INVARIANTS
  MembersInvitedOrSameAccount
  EndedRoomIsEmpty
  ExpiredGuestNotMember
  OneHostPresent
  KickedStayOut
  HostHasTorBox
