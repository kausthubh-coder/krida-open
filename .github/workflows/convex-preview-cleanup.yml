name: Delete Convex preview

# A merged or closed PR's preview backend goes at once, instead of holding one of the team's deployments for 5 days.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/delete-convex-preview.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The branch name comes from the PR, so it goes in as an argument, never into the script.
      - run: node scripts/delete-convex-preview.mjs "$BRANCH"
        env:
          BRANCH: ${{ github.head_ref }}
          CONVEX_TEAM_TOKEN: ${{ secrets.CONVEX_TEAM_TOKEN }}
